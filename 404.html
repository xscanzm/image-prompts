<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - 页面未找到 | AI Pipixia</title>
  <meta name="description" content="您访问的页面不存在，返回 AI Pipixia 提示词案例库首页。">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1220;
      --bg-card: #15253f;
      --border: rgba(148, 163, 184, 0.2);
      --primary: #38bdf8;
      --text: #e2e8f0;
      --text-subtle: #94a3b8;
      --radius-lg: 18px;
      --radius-md: 12px;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 10% 10%, rgba(56, 189, 248, 0.12), transparent 35%),
        radial-gradient(circle at 90% 5%, rgba(168, 85, 247, 0.07), transparent 40%),
        var(--bg);
      color: var(--text);
      padding: 2rem;
    }
    .container {
      text-align: center;
      max-width: 480px;
    }
    .error-code {
      font-size: clamp(6rem, 15vw, 10rem);
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 0.5rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #f8fafc;
      margin-bottom: 0.5rem;
    }
    p {
      color: var(--text-subtle);
      margin-bottom: 2rem;
      line-height: 1.6;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      background: var(--primary);
      color: #0b1220;
      font-weight: 600;
      font-size: 1rem;
      border-radius: var(--radius-md);
      text-decoration: none;
      transition: opacity 0.2s ease;
    }
    .btn:hover {
      opacity: 0.85;
      text-decoration: none;
    }
    .qr-section {
      margin-top: 2.5rem;
      padding: 1.5rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
    }
    .qr-section h2 {
      font-size: 1rem;
      margin-bottom: 1rem;
      color: #f8fafc;
    }
    .qr-section img {
      width: 160px;
      height: 160px;
      border-radius: var(--radius-md);
      object-fit: cover;
    }
    .qr-section p {
      margin-top: 0.75rem;
      margin-bottom: 0;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="error-code">404</div>
    <h1>页面未找到</h1>
    <p>你访问的页面可能已被移除或地址有误。<br>返回首页继续探索 AI 提示词案例吧！</p>
    <a href="/" class="btn">🏠 返回首页</a>
    <div class="qr-section">
      <h2>📱 关注公众号获取更多灵感</h2>
      <img src="/wechat-qr.jpg" alt="未来职场AI学堂">
      <p>微信公众号：未来职场AI学堂</p>
    </div>
  </div>
</body>
</html>
