<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🎨 AI Pipixia - 提示词案例库</title>
  <meta name="description" content="AI Pipixia 提供 AI 图像生成提示词案例，快速复制提示词，探索灵感，提升创作效率。">
  <meta name="keywords" content="AI Pipixia, 提示词, AI 提示词, AI 案例, 提示词库, Nano Banana">
  <link rel="stylesheet" href="./assets/styles.css">
  <link rel="icon" href="./favicon.ico" type="image/x-icon">
  <style>
    .header-cta {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: nowrap;
    }
    .header-cta .cta-card {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      flex: 0 0 auto;
      max-width: 280px;
    }
    .header-cta .cta-card img {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-sm);
      object-fit: cover;
      flex-shrink: 0;
    }
    .header-cta .cta-card .cta-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }
    .header-cta .cta-card .cta-text .cta-title {
      font-size: 13px;
      font-weight: 600;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-cta .cta-card .cta-text .cta-desc {
      font-size: 11px;
      color: var(--text-subtle);
      line-height: 1.3;
    }
  </style>
</head>
<body>
<header class="app-header">
  <div class="controls-with-left">
    <div class="header-top">
      <h1>AI Pipixia 提示词图库</h1>
      <p class="tagline">浏览、筛选和搜索提示词案例图库，快速复制提示词，探索灵感。</p>
    </div>

    <div class="control-bar">
      <label class="search-field" for="searchInput">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input id="searchInput" type="search" placeholder="搜索案例编号、标题或提示词..." autocomplete="off">
        <button id="clearSearch" class="ghost-btn" type="button" aria-label="清除搜索">✕</button>
      </label>
      <div class="actions-row">
        <button id="clearFilters" class="ghost-btn clear-filter-btn" type="button">清除筛选</button>
        <div id="resultStats" class="result-stats" role="status" aria-live="polite"></div>
      </div>
    </div>
  </div>
    <div class="controls-with-right">
      <div class="header-cta">
        <div class="cta-card">
          <img src="./wechat-qr.jpg" alt="未来职场AI学堂">
          <div class="cta-text">
            <span class="cta-title">📱 未来职场AI学堂</span>
            <span class="cta-desc">关注公众号，获取最新 AI 提示词教程</span>
          </div>
        </div>
      </div>
    </div>
  <div class="tag-filter-container">
    <div id="tagFilters" class="tag-filter" aria-label="标签筛选" role="group"></div>
  </div>
</header>

<main>
  <section id="gallery" class="gallery" aria-live="polite"></section>
  <div id="emptyState" class="empty-state hidden">
    <p>没有匹配的结果，请尝试调整标签或搜索关键词。</p>
  </div>
</main>

<div id="detailModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-content">
    <button id="modalClose" class="modal-close" aria-label="关闭详情">✕</button>
    <header class="modal-header">
      <h2 id="modalTitle"></h2>
      <div id="modalSource" class="modal-source"></div>
    </header>
    <div class="modal-tags" id="modalTags"></div>
    <section id="modalImages" class="modal-section"></section>
    <section id="modalPrompts" class="modal-section"></section>
    <section id="modalExamples" class="modal-section"></section>
    <section id="modalNotes" class="modal-section"></section>
    <section id="modalDescription" class="modal-section"></section>
  </div>
</div>

<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "name": "AI Pipixia - 提示词案例库",
    "description": "AI Pipixia 提供 AI 图像生成提示词案例，快速复制提示词，探索灵感。",
    "keywords": "AI Pipixia, 提示词, AI 提示词, AI 案例, 提示词库",
    "url": "https://www.aipipixia.online/"
  }
</script>

<script type="module" src="./assets/app.js"></script>
</body>
</html>
